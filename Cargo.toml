[package]
name = "json-log-viewer-worker"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "json-log-viewer-worker"
path = "rust/json-log-viewer-worker/src/main.rs"

[[bin]]
name = "json-log-viewer-ingest-wrapper"
path = "rust/json-log-viewer-ingest-wrapper/src/main.rs"

[[bin]]
name = "kube-log-supervisor"
path = "rust/kube-log-supervisor/src/main.rs"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock"] }
futures = "0.3"
k8s-openapi = { version = "0.27", features = ["v1_31"] }
kube = { version = "3.1", default-features = false, features = ["client", "config", "runtime", "rustls-tls"] }
libc = "0.2"
regex = "1"
rustls = { version = "0.23", default-features = false, features = ["ring"] }
rusqlite = { version = "0.31", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["io-util", "macros", "rt-multi-thread", "signal", "time"] }
